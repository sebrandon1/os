# RHCOS Auditd Hardening Defaults
# Addresses compliance groups: M9, M20
# Reference: https://sebrandon1.github.io/compliance-scripts/

# Identify audit log source by hostname (M9)
# Critical for centralized log aggregation across multi-node clusters
name_format = hostname

# Audit data retention settings (M20)
# Ensure audit logs are preserved under disk pressure
space_left = 100
admin_space_left_action = syslog
disk_full_action = syslog
disk_error_action = syslog
