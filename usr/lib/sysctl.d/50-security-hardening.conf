# RHCOS Security Hardening
# Addresses compliance groups: L2, M2
# Reference: https://sebrandon1.github.io/compliance-scripts/

# Restrict kernel log access to privileged users (L2)
kernel.dmesg_restrict = 1

# Harden BPF JIT against spraying attacks (M2)
# KSPP recommended, negligible performance impact
net.core.bpf_jit_harden = 2

# Restrict ptrace to parent-child processes (M2)
# Kernel default is 1, but elfutils-default-yama-scope overrides to 0
# RHCOS is a container host, not a developer workstation
kernel.yama.ptrace_scope = 1
